services:
  watchgate-locksight-platform:
    image: watchgate-locksight-platform:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: ${DATABASE_URL:-mysql}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-watchgate-locksight-db}
      DATABASE_USER: ${DATABASE_USER:-root}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      TOKEN_SECRET: ${TOKEN_SECRET}
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_SCHEMA:-watchgate-locksight-db}
    ports:
      - "3306:3306"
    volumes:
      - watchgate-locksight-data:/var/lib/mysql

volumes:
  watchgate-locksight-data:
